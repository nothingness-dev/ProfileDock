name: Continuous Integration

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/*
          retention-days: 2

  lightweight:
    name: Lightweight install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist

      - name: Install wheel without optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest (Get-ChildItem dist/*.whl).FullName
        if: runner.os == 'Windows'

      - name: Install wheel without optional dependencies (POSIX)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl
        if: runner.os != 'Windows'

      - name: Run unit and CLI smoke tests (no playwright)
        run: |
          python -m pytest -m "not browser"

      - name: Verify direct engine CLI commands
        run: |
          profiledock --version
          profiledock --help

  full:
    name: Full install with Playwright (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist

      - name: Install wheel with Playwright extras (Windows)
        run: |
          python -m pip install --upgrade pip
          $whl = (Get-ChildItem dist/*.whl).FullName
          python -m pip install "$whl`[playwright,test`]"
          python -m playwright install --with-deps chromium
        if: runner.os == 'Windows'

      - name: Install wheel with Playwright extras (POSIX)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/$(ls dist | grep '\.whl$')[playwright,test]"
          python -m playwright install --with-deps chromium
        if: runner.os != 'Windows'

      - name: Run full integration and browser test suite
        run: |
          python -m pytest

  hygiene:
    name: Code hygiene & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for trailing whitespace and git formatting
        run: |
          git diff --check HEAD~1 || git diff --check

      - name: Verify runtime and package version alignment
        run: |
          python -m pip install .
          python -c "import importlib.metadata, profiledock; assert importlib.metadata.version('profiledock') == profiledock.__version__"
