[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profiledock"
version = "0.1.3"
description = "A lightweight CLI for isolated persistent Chromium profiles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "typer>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
profiledock = "profiledock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: end-to-end tests that launch a real Chromium or Chrome process",
]
