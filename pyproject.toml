[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profiledock"
dynamic = ["version"]
description = "A lightweight CLI for isolated persistent Chromium profiles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9",
]

[tool.setuptools.dynamic]
version = {attr = "profiledock.version.__version__"}

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
test = [
    "pytest>=7",
    "playwright>=1.40",
]


[project.scripts]
profiledock = "profiledock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: end-to-end tests that launch a real Chromium or Chrome process",
]
